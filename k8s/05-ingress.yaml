apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sql50
  namespace: sql50
  labels:
    app.kubernetes.io/name: sql50
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: sql50-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "SQL50"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sql50.offline-learning.com]
      secretName: sql50-tls
  rules:
    - host: sql50.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sql50
                port:
                  name: http
